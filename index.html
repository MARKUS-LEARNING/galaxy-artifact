<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' blob: https://js-cdn.music.apple.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self' https://api.music.apple.com https://accounts.spotify.com https://api.spotify.com;
        worker-src blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'none';
        frame-ancestors 'none';
      ">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GALAXY ARTIFACT</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Space Mono', monospace; overflow: hidden; }

  /* Elegant thin scrollbars */
  * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.15) transparent; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

  canvas { display: block; position: fixed; top: 0; left: 0; touch-action: none; }

  #hud {
    position: fixed; top: 20px; left: 20px; z-index: 10; pointer-events: none;
  }
  #hud h1 {
    font-size: 14px; letter-spacing: 6px; color: #333; text-transform: uppercase;
    animation: hud-entrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  #hud .sub { font-size: 9px; letter-spacing: 2px; color: #666; margin-top: 3px; }

  #bottom-left {
    position: fixed; bottom: 20px; left: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: none;
  }
  #bottom-left > * { pointer-events: auto; }
  #info {
    font-size: 10px; letter-spacing: 2px; color: #666;
    line-height: 1.9; pointer-events: none;
  }

  /* Mobile hamburger menu */
  #mobile-menu-btn {
    display: none; position: fixed; bottom: 20px; right: 20px; z-index: 35;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid #ddd; cursor: pointer;
    font-size: 18px; color: #555;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    font-family: inherit;
    transition: transform 0.2s ease, background 0.15s, color 0.15s;
  }
  #mobile-menu-btn:active { background: #222; color: #fff; border-color: #222; transform: scale(0.92); }
  #mobile-menu-backdrop {
    display: none; position: fixed; inset: 0; z-index: 29;
    background: rgba(0,0,0,0.25); opacity: 0;
    transition: opacity 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #mobile-menu-backdrop.visible { opacity: 1; }
  #mobile-menu {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(255,255,255,0.98); backdrop-filter: blur(16px);
    border-top: 1px solid #eee; border-radius: 16px 16px 0 0;
    max-height: 70vh; overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #mobile-menu.open { transform: translateY(0); }
  /* Drag handle */
  #mobile-menu .mm-handle {
    display: flex; justify-content: center; padding: 10px 0 2px;
    cursor: grab; touch-action: none;
  }
  #mobile-menu .mm-handle-bar {
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(0,0,0,0.15);
  }
  #mobile-menu .mm-header {
    display: flex; align-items: center; border-bottom: 1px solid #eee;
    position: sticky; top: 0; background: rgba(255,255,255,0.98);
    backdrop-filter: blur(16px); z-index: 1;
  }
  #mobile-menu .mm-tabs {
    display: flex; flex: 1;
  }
  #mobile-menu .mm-tab {
    flex: 1; padding: 14px 8px; font-family: inherit; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; color: #999;
    background: none; border: none; cursor: pointer; text-align: center;
  }
  #mobile-menu .mm-tab.active { color: #222; border-bottom: 2px solid #222; }
  #mobile-menu .mm-close {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: #999; font-family: inherit;
    flex-shrink: 0;
  }
  #mobile-menu .mm-close:active { color: #222; }
  #mobile-menu .mm-panel { display: none; padding: 14px 16px; }
  #mobile-menu .mm-panel.active { display: block; }

  /* Screen reader announcements */
  #sr-announcer {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* Album Card (replaces tooltip) */
  #album-card {
    position: fixed; z-index: 20;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
    border: 1px solid #eee; padding: 20px 24px;
    font-size: 12px; letter-spacing: 1px; line-height: 1.9;
    color: #222; display: none;
    max-width: 380px; min-width: 240px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border-radius: 4px;
  }
  #album-card .ac-handle { display: none; }
  #album-card .ac-close {
    position: absolute; top: 8px; right: 12px;
    font-size: 18px; cursor: pointer; color: #767676;
    background: none; border: none; font-family: inherit;
    line-height: 1; padding: 2px 4px;
  }
  #album-card .ac-close:hover { color: #333; }
  #album-card .ac-name { font-weight: 700; font-size: 15px; letter-spacing: 2px; margin-bottom: 4px; padding-right: 20px; }
  #album-card .ac-sub { color: #555; font-size: 12px; margin-bottom: 6px; }
  #album-card .ac-genre {
    display: inline-block; padding: 3px 10px; border-radius: 3px;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  #album-card .ac-links { display: flex; gap: 8px; flex-wrap: wrap; }
  #album-card .ac-link {
    display: inline-block; padding: 6px 14px; border-radius: 3px;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    background: #222; color: #fff; text-decoration: none;
    font-family: inherit; transition: background 0.15s;
  }
  #album-card .ac-link:hover { background: #555; }
  #album-card .ac-link:active { transform: scale(0.95); }
  #album-card .ac-link.ac-yt:hover { background: #cc0000; }
  #album-card .ac-link.ac-spotify:hover { background: #1db954; }
  #album-card .ac-link.ac-apple:hover { background: #fa243c; }
  #album-card .ac-link.ac-discogs:hover { background: #333; }

  /* Heart button on album card */
  #album-card .ac-heart {
    position: absolute; top: 8px; right: 38px;
    background: none; border: none; cursor: pointer;
    padding: 2px 4px; line-height: 1;
  }
  #album-card .ac-heart .heart-svg {
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #album-card .ac-heart .heart-path {
    fill: none;
    stroke: #ccc;
    stroke-width: 1.5;
    stroke-dasharray: 3 2;
    transition: fill 0.3s ease, stroke 0.3s ease, stroke-dasharray 0.3s ease;
  }
  #album-card .ac-heart:hover .heart-path {
    stroke: #e74c3c;
    stroke-dasharray: none;
  }
  #album-card .ac-heart.hearted .heart-path {
    fill: #e74c3c;
    stroke: #e74c3c;
    stroke-dasharray: none;
  }
  @keyframes heart-jump {
    0%   { transform: scale(1); }
    15%  { transform: scale(0.7); }
    30%  { transform: scale(1.3) rotate(-8deg); }
    45%  { transform: scale(0.95) rotate(4deg); }
    60%  { transform: scale(1.15) rotate(-2deg); }
    75%  { transform: scale(0.98); }
    100% { transform: scale(1); }
  }
  #album-card .ac-heart.jumping .heart-svg {
    animation: heart-jump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* ─── Kinetic Typography (Design Manifesto: Jet Set Radio / tDR) ─── */
  @keyframes hud-entrance {
    from { opacity: 0; letter-spacing: 16px; filter: blur(2px); }
    to { opacity: 1; letter-spacing: 6px; filter: blur(0); }
  }
  /* ─── Loading Pulse (Design Manifesto: fluid motion) ─── */
  @keyframes loading-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  #album-card.pinned { border-left: 3px solid #555; }

  /* Search bar — constrained between logo (left) and buttons (right) */
  #search-bar {
    position: fixed; top: 20px; left: 180px; right: 240px;
    z-index: 12; display: flex; align-items: center; gap: 0;
    max-width: 280px; margin: 0 auto;
  }
  #search-bar input {
    font-family: inherit; font-size: 10px; letter-spacing: 1px;
    padding: 5px 10px; width: 100%;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border: 1px solid #ddd; border-radius: 3px;
    color: #333; outline: none;
    transition: width 0.25s ease, padding 0.25s ease, opacity 0.25s ease;
  }
  #search-bar input::placeholder { color: #999; letter-spacing: 2px; font-size: 8px; }
  #search-bar input:focus { border-color: #999; background: rgba(255,255,255,0.97); }
  /* Search icon toggle (mobile only) */
  #search-toggle {
    display: none; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid #ddd; cursor: pointer;
    font-size: 14px; color: #555; font-family: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  #search-toggle:active { background: #222; color: #fff; border-color: #222; }
  #search-count {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: inherit; font-size: 8px; letter-spacing: 1px;
    color: #aaa; pointer-events: none;
    opacity: 0; transition: opacity 0.2s ease;
  }
  #search-count.visible { opacity: 1; }
  #search-results {
    position: fixed; top: 46px; left: 180px; right: 240px;
    z-index: 11; max-width: 280px; margin: 0 auto; max-height: 60vh; overflow-y: auto;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
    border: 1px solid #eee; border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    visibility: hidden; opacity: 0; transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  #search-results.open { visibility: visible; opacity: 1; transform: translateY(0); }
  .sr-item {
    padding: 8px 14px; cursor: pointer;
    border-bottom: 1px solid #f5f5f5;
    transition: background 0.1s;
  }
  .sr-item:hover { background: #f8f8f8; }
  .sr-item:last-child { border-bottom: none; }
  .sr-name { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #222; }
  .sr-sub { font-size: 9px; letter-spacing: 1px; color: #666; margin-top: 2px; }
  .sr-match { background: rgba(231,76,60,0.12); padding: 0 2px; border-radius: 2px; }
  .sr-empty {
    padding: 16px 14px; text-align: center;
    font-size: 9px; letter-spacing: 1px; color: #767676;
  }
  .sr-hint {
    padding: 8px 14px; text-align: center;
    font-size: 8px; letter-spacing: 1px; color: #767676;
    border-top: 1px solid #f0f0f0;
  }

  /* Customize panel */
  #ctrl-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 12;
    font-family: inherit; font-size: 8px; letter-spacing: 3px;
    text-transform: uppercase; background: rgba(255,255,255,0.9);
    border: 1px solid #ddd; color: #555; padding: 5px 12px;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  #ctrl-toggle:hover { border-color: #999; color: #222; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  #ctrl-panel {
    position: fixed; top: 44px; right: 20px; z-index: 11;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid #eee; padding: 14px 16px;
    width: 220px; max-height: calc(100vh - 60px); overflow-y: auto;
    visibility: hidden; opacity: 0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    box-shadow: 0 2px 16px rgba(0,0,0,0.04);
  }
  #ctrl-panel.open { visibility: visible; opacity: 1; transform: translateY(0); }
  #ctrl-panel label {
    display: block; font-size: 7px; letter-spacing: 2px;
    text-transform: uppercase; color: #888; margin: 8px 0 3px;
  }
  #ctrl-panel label:first-child { margin-top: 0; }
  #ctrl-panel input[type=range] {
    width: 100%; border: none; padding: 0; margin: 2px 0; accent-color: #666;
  }
  #ctrl-panel .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  #ctrl-panel .chip {
    font-family: inherit; font-size: 7px; letter-spacing: 1px;
    padding: 3px 8px; border: 1px solid #ddd; background: none;
    color: #666; cursor: pointer; text-transform: uppercase;
    transition: all 0.15s ease;
  }
  #ctrl-panel .chip:hover { border-color: #999; transform: translateY(-1px); }
  #ctrl-panel .chip:active { transform: scale(0.95); }
  #ctrl-panel .chip.on { background: #222; color: #fff; border-color: #222; }
  #ctrl-panel hr { border: none; border-top: 1px solid #f0f0f0; margin: 10px 0; }

  /* Filter/Sort panel */
  #filter-toggle {
    position: fixed; top: 20px; right: 130px; z-index: 12;
    font-family: inherit; font-size: 8px; letter-spacing: 3px;
    text-transform: uppercase; background: rgba(255,255,255,0.9);
    border: 1px solid #ddd; color: #555; padding: 5px 12px;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  #filter-toggle:hover { border-color: #999; color: #222; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  #filter-toggle.active { background: #222; color: #fff; border-color: #222; }
  #filter-panel {
    position: fixed; top: 44px; right: 20px; z-index: 11;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid #eee; padding: 16px 18px;
    width: 280px; max-height: calc(100vh - 60px); overflow-y: auto;
    visibility: hidden; opacity: 0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    border-radius: 4px;
  }
  #filter-panel.open { visibility: visible; opacity: 1; transform: translateY(0); }
  #filter-panel .fp-section-title {
    font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
    color: #999; margin: 0 0 8px;
  }
  #filter-panel .fp-sort-row {
    display: flex; gap: 6px; align-items: center; margin-bottom: 16px;
  }
  #filter-panel select {
    font-family: inherit; font-size: 10px; letter-spacing: 0.5px;
    padding: 6px 8px; border: 1px solid #e0e0e0; border-radius: 3px;
    background: #fff; color: #333; flex: 1; outline: none;
  }
  #filter-panel select:focus { border-color: #999; }
  #filter-panel .fp-sort-dir {
    font-family: inherit; font-size: 9px; letter-spacing: 1px;
    padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 3px;
    background: #fff; color: #555; cursor: pointer; white-space: nowrap;
  }
  #filter-panel .fp-sort-dir:hover { border-color: #999; }
  #filter-panel .fp-sort-dir.on { background: #222; color: #fff; border-color: #222; }
  #filter-panel .fp-divider { border: none; border-top: 1px solid #f0f0f0; margin: 0 0 14px; }
  #filter-panel .fp-col-name {
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: #555; margin: 0 0 6px; font-weight: 700;
  }
  #filter-panel .fp-chips {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px;
  }
  #filter-panel .fp-chip {
    font-family: inherit; font-size: 9px; letter-spacing: 0.5px;
    padding: 4px 10px; border: 1px solid #e0e0e0; border-radius: 12px;
    background: #fff; color: #555; cursor: pointer;
    transition: all 0.15s ease;
  }
  #filter-panel .fp-chip:hover { border-color: #aaa; color: #222; transform: translateY(-1px); }
  #filter-panel .fp-chip:active { transform: scale(0.95); }
  #filter-panel .fp-chip.on { background: #222; color: #fff; border-color: #222; }
  #filter-panel .fp-chip .fp-chip-count {
    font-size: 8px; color: #aaa; margin-left: 3px;
  }
  #filter-panel .fp-chip.on .fp-chip-count { color: rgba(255,255,255,0.5); }
  #filter-panel .fp-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 10px; border-top: 1px solid #f0f0f0;
  }
  #filter-panel .fp-status {
    font-size: 9px; letter-spacing: 0.5px; color: #999;
  }
  #filter-panel .fp-clear {
    font-family: inherit; font-size: 9px; letter-spacing: 1px;
    text-transform: uppercase; padding: 5px 12px;
    border: 1px solid #e0e0e0; border-radius: 3px;
    background: #fff; color: #555; cursor: pointer;
  }
  #filter-panel .fp-clear:hover { border-color: #999; color: #222; }

  /* ─── Year Dropdown ─── */
  #year-dropdown {
    position: fixed; bottom: 20px; right: 80px; z-index: 15;
    display: none; flex-direction: column; align-items: center; gap: 4px;
  }
  #year-dropdown .yd-label {
    font-size: 7px; letter-spacing: 2px; text-transform: uppercase;
    color: #999;
  }
  #year-dropdown select {
    font-family: inherit; font-size: 11px; letter-spacing: 0.5px;
    padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    color: #333; outline: none; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  #year-dropdown select:focus { border-color: #999; }
  body.dark-mode #year-dropdown .yd-label { color: rgba(255,255,255,0.4); }
  body.dark-mode #year-dropdown select {
    background: rgba(12,12,18,0.92); border-color: rgba(255,255,255,0.08);
    color: #eee;
  }

  /* Upload prompt (bottom-left) */
  #upload-bar .ub-link {
    font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: #555; cursor: pointer;
    background: none; border: none; padding: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  #upload-bar .ub-link:hover { color: #333; }
  #upload-bar input { display: none; }
  #upload-bar .ub-status {
    font-size: 8px; letter-spacing: 2px; color: #999;
    margin-top: 4px; display: none;
  }
  .ub-progress {
    width: 160px; height: 3px; background: #eee;
    margin-top: 6px; display: none; border-radius: 1px;
  }
  .ub-progress-fill {
    height: 100%; width: 0%; background: #555;
    border-radius: 1px; transition: width 0.15s;
  }

  /* Artifact Archive */
  #artifact-bag {
    position: relative;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border: 1px solid #eee; border-radius: 6px;
    width: 260px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
    transition: box-shadow 0.3s ease;
  }
  #artifact-bag:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  #artifact-bag .ab-toggle {
    font-family: inherit; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; color: #333; cursor: pointer;
    background: none; border: none; padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
    width: 100%;
  }
  #artifact-bag .ab-toggle:hover { color: #e74c3c; }
  #artifact-bag .ab-icon {
    font-size: 18px; transition: transform 0.3s ease, color 0.3s ease;
  }
  #artifact-bag .ab-count {
    background: #e74c3c; color: #fff; font-size: 9px;
    padding: 1px 6px; border-radius: 8px; min-width: 18px;
    text-align: center; display: none;
  }
  #artifact-bag .ab-count.has-items { display: inline-block; }
  #artifact-bag .ab-chevron {
    margin-left: auto; font-size: 10px; color: #aaa;
    transition: transform 0.3s ease;
  }
  #artifact-bag.open .ab-chevron { transform: rotate(180deg); }
  #artifact-bag .ab-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #artifact-bag.open .ab-body {
    max-height: 400px;
  }
  #artifact-bag .ab-body-inner {
    padding: 0 14px 6px;
    max-height: 280px; overflow-y: auto;
  }
  #artifact-bag .ab-footer {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 6px 14px 8px; border-top: 1px solid #f0f0f0;
  }
  #artifact-bag .ab-export {
    font-family: inherit; font-size: 9px; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 10px;
    background: #222; color: #fff; border: none; cursor: pointer;
    border-radius: 2px;
  }
  #artifact-bag .ab-export:hover { background: #555; }
  #artifact-bag .ab-item {
    display: flex; align-items: center;
    padding: 6px 0; border-bottom: 1px solid #f5f5f5;
    font-size: 11px; letter-spacing: 0.5px; color: #333;
  }
  #artifact-bag .ab-item:last-child { border-bottom: none; }
  #artifact-bag .ab-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #artifact-bag .ab-item-artist { color: #999; font-size: 10px; margin-left: 6px; flex-shrink: 0; }
  #artifact-bag .ab-item-remove {
    background: none; border: none; color: #ccc; cursor: pointer;
    font-size: 14px; padding: 0 0 0 8px; font-family: inherit; flex-shrink: 0;
    line-height: 1;
  }
  #artifact-bag .ab-item-remove:hover { color: #e74c3c; }
  #artifact-bag .ab-empty {
    font-size: 10px; color: #bbb; letter-spacing: 1px;
    text-align: center; padding: 16px 0;
  }

  /* Swooping ghost animation */
  .swoop-ghost {
    position: fixed; z-index: 100;
    font-family: 'Space Mono', monospace;
    font-size: 12px; font-weight: 700;
    letter-spacing: 2px; color: #e74c3c;
    pointer-events: none; white-space: nowrap;
  }

  /* Drag-and-drop overlay */
  body.drag-over::after {
    content: ''; position: fixed; inset: 12px; z-index: 50;
    border: 2px dashed #999; border-radius: 8px;
    background: rgba(255,255,255,0.04); pointer-events: none;
  }

  /* Loading overlay (shown only during initial load) */
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 100; text-align: center;
    font-size: 9px; letter-spacing: 6px; color: #999; text-transform: uppercase;
    animation: loading-pulse 2s ease-in-out infinite;
  }
  #loading.hidden { display: none; }

  /* ─── Safe Area Insets ─── */
  #bottom-left { padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
  #hud { padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); }

  /* ─── Reduced Motion ─── */
  @media (prefers-reduced-motion: reduce) {
    .swoop-ghost, #album-card .ac-heart .heart-svg, #album-card .ac-heart.jumping .heart-svg,
    #hud h1, #loading { animation: none !important; transition: none !important; }
    #artifact-bag .ab-body { transition: none; }
    #mobile-menu { transition: none; }
    #mobile-menu-backdrop { transition: none; }
    #ctrl-panel, #filter-panel, #search-results { transition: none; }
  }

  /* ─── Dark Mode Adaptation (Design Manifesto: emotional dark mode, frosted layers) ─── */
  body.dark-mode { scrollbar-color: rgba(255,255,255,0.15) transparent; }
  body.dark-mode ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  body.dark-mode ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  body.dark-mode #ctrl-toggle,
  body.dark-mode #filter-toggle {
    background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6);
  }
  body.dark-mode #ctrl-toggle:hover,
  body.dark-mode #filter-toggle:hover {
    border-color: rgba(255,255,255,0.3); color: #fff; box-shadow: 0 2px 12px rgba(255,255,255,0.04);
  }
  body.dark-mode #filter-toggle.active { background: rgba(255,255,255,0.85); color: #111; border-color: rgba(255,255,255,0.85); }
  body.dark-mode #search-toggle { background: rgba(12,12,18,0.9); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
  body.dark-mode #search-toggle:active { background: rgba(255,255,255,0.85); color: #111; }
  body.dark-mode #search-bar input {
    background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); color: #eee;
  }
  body.dark-mode #search-bar input::placeholder { color: rgba(255,255,255,0.35); }
  body.dark-mode #search-bar input:focus { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
  body.dark-mode #search-count { color: rgba(255,255,255,0.4); }
  body.dark-mode #ctrl-panel,
  body.dark-mode #filter-panel,
  body.dark-mode #search-results {
    background: rgba(12,12,18,0.92); border-color: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
  }
  body.dark-mode #ctrl-panel label,
  body.dark-mode #filter-panel .fp-section-title { color: rgba(255,255,255,0.45); }
  body.dark-mode #ctrl-panel .chip,
  body.dark-mode #filter-panel .fp-chip,
  body.dark-mode #filter-panel .fp-sort-dir,
  body.dark-mode #filter-panel .fp-clear {
    background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
  }
  body.dark-mode #ctrl-panel .chip:hover,
  body.dark-mode #filter-panel .fp-chip:hover,
  body.dark-mode #filter-panel .fp-sort-dir:hover,
  body.dark-mode #filter-panel .fp-clear:hover { border-color: rgba(255,255,255,0.25); color: #fff; }
  body.dark-mode #ctrl-panel .chip.on,
  body.dark-mode #filter-panel .fp-chip.on,
  body.dark-mode #filter-panel .fp-sort-dir.on { background: rgba(255,255,255,0.88); color: #111; border-color: rgba(255,255,255,0.88); }
  body.dark-mode #filter-panel .fp-chip .fp-chip-count { color: rgba(255,255,255,0.3); }
  body.dark-mode #filter-panel .fp-chip.on .fp-chip-count { color: rgba(0,0,0,0.4); }
  body.dark-mode #filter-panel .fp-col-name { color: rgba(255,255,255,0.7); }
  body.dark-mode #filter-panel select { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); color: #eee; }
  body.dark-mode #filter-panel .fp-status { color: rgba(255,255,255,0.4); }
  body.dark-mode #filter-panel .fp-divider,
  body.dark-mode #ctrl-panel hr { border-color: rgba(255,255,255,0.06); }
  body.dark-mode #album-card {
    background: rgba(12,12,18,0.94); border-color: rgba(255,255,255,0.08);
    color: #eee; backdrop-filter: blur(20px);
  }
  body.dark-mode #album-card .ac-sub { color: #aaa; }
  body.dark-mode #album-card .ac-close { color: rgba(255,255,255,0.5); }
  body.dark-mode #album-card .ac-close:hover { color: #fff; }
  body.dark-mode #album-card.pinned { border-left-color: rgba(255,255,255,0.2); }
  body.dark-mode #album-card .ac-link { background: rgba(255,255,255,0.1); }
  body.dark-mode #album-card .ac-handle-bar { background: rgba(255,255,255,0.2); }
  body.dark-mode #album-card .ac-heart .heart-path { stroke: rgba(255,255,255,0.3); }
  body.dark-mode #album-card .ac-heart:hover .heart-path { stroke: #e74c3c; }
  body.dark-mode #artifact-bag { background: rgba(12,12,18,0.92); border-color: rgba(255,255,255,0.08); }
  body.dark-mode #artifact-bag .ab-item { color: #ddd; border-color: rgba(255,255,255,0.06); }
  body.dark-mode #artifact-bag .ab-item-artist { color: rgba(255,255,255,0.5); }
  body.dark-mode #artifact-bag .ab-item-remove { color: rgba(255,255,255,0.3); }
  body.dark-mode #artifact-bag .ab-item-remove:hover { color: #e74c3c; }
  body.dark-mode #artifact-bag .ab-empty { color: rgba(255,255,255,0.3); }
  body.dark-mode #artifact-bag .ab-footer { border-color: rgba(255,255,255,0.06); }
  body.dark-mode .sr-item { border-color: rgba(255,255,255,0.04); }
  body.dark-mode .sr-item:hover { background: rgba(255,255,255,0.06); }
  body.dark-mode .sr-name { color: #eee; }
  body.dark-mode .sr-sub { color: #999; }
  body.dark-mode .sr-empty,
  body.dark-mode .sr-hint { color: rgba(255,255,255,0.4); }
  body.dark-mode .sr-hint { border-color: rgba(255,255,255,0.06); }
  body.dark-mode #upload-bar .ub-link { color: rgba(255,255,255,0.6); }
  body.dark-mode #upload-bar .ub-link:hover { color: #fff; }
  body.dark-mode #mobile-menu-btn { background: rgba(12,12,18,0.9); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
  body.dark-mode #mobile-menu-backdrop { background: rgba(0,0,0,0.5); }
  body.dark-mode #mobile-menu { background: rgba(12,12,18,0.98); border-color: rgba(255,255,255,0.08); }
  body.dark-mode #mobile-menu .mm-handle-bar { background: rgba(255,255,255,0.2); }
  body.dark-mode #mobile-menu .mm-tab { color: rgba(255,255,255,0.5); }
  body.dark-mode #mobile-menu .mm-tab.active { color: #fff; border-color: #fff; }
  body.dark-mode #mobile-menu .mm-header { background: rgba(12,12,18,0.98); border-color: rgba(255,255,255,0.06); }
  body.dark-mode #mobile-menu .mm-close { color: rgba(255,255,255,0.5); }
  body.dark-mode #mobile-menu .mm-close:active { color: #fff; }
  body.dark-mode.drag-over::after { border-color: rgba(255,255,255,0.3); }

  /* ─── Tablet (769-1199px) ─── */
  @media (max-width: 1199px) {
    #search-bar { left: 160px; right: 220px; }
    #search-results { left: 160px; right: 220px; }
  }

  /* ─── Mobile (≤768px) ─── */
  @media (max-width: 768px) {
    /* Search bar: collapsed icon by default, expands on tap */
    #search-bar {
      left: auto; right: 12px; top: 16px; transform: none;
      width: auto; max-width: none; flex-direction: row-reverse; gap: 6px;
    }
    #search-toggle { display: flex; align-items: center; justify-content: center; }
    #search-bar input {
      width: 0; padding: 0; border: none; opacity: 0;
      pointer-events: none; position: absolute; right: 42px;
    }
    #search-bar.expanded input {
      width: calc(100vw - 80px); padding: 10px 50px 10px 14px;
      border: 1px solid #ddd; opacity: 1; pointer-events: auto;
      font-size: 14px; min-height: 44px; border-radius: 3px;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
    }
    #search-bar.expanded input::placeholder { font-size: 11px; }
    #search-bar.expanded #search-toggle { background: #222; color: #fff; border-color: #222; }
    #search-count { font-size: 10px; right: 54px; }
    #search-results {
      left: 12px; right: 12px; transform: none; width: auto;
      top: 62px; max-width: none; max-height: 50vh;
    }
    .sr-item { padding: 12px 14px; min-height: 44px; }
    .sr-name { font-size: 13px; }
    .sr-sub { font-size: 11px; }

    /* Album card: bottom sheet */
    #album-card {
      position: fixed !important; left: 0 !important; right: 0 !important;
      bottom: 0 !important; top: auto !important;
      max-width: none; width: 100%;
      border-radius: 16px 16px 0 0; max-height: 50vh;
      overflow-y: auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    }
    #album-card .ac-handle {
      display: flex; justify-content: center; padding: 0 0 10px;
      cursor: grab; touch-action: none;
    }
    #album-card .ac-handle-bar {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(0,0,0,0.15);
    }
    #album-card .ac-name { font-size: 16px; }
    #album-card .ac-sub { font-size: 13px; }
    #album-card .ac-genre { font-size: 12px; }
    #album-card .ac-link { padding: 10px 16px; font-size: 11px; min-height: 44px; display: inline-flex; align-items: center; }
    #album-card .ac-close { font-size: 22px; padding: 8px 12px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    #album-card .ac-heart { padding: 8px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

    /* HUD: always visible above search */
    #hud { z-index: 13; }
    #hud h1 { font-size: 10px; }
    #hud .sub { font-size: 9px; }

    /* Customize/Filter buttons: hidden on mobile (use hamburger) */
    #ctrl-toggle, #filter-toggle { display: none; }

    /* Panels: hidden on mobile (content reparented to hamburger menu) */
    #ctrl-panel, #filter-panel {
      display: none !important;
    }

    /* Bottom-left area */
    #bottom-left { left: 12px; bottom: 12px; right: 12px; }
    #artifact-bag { width: 100%; }
    #info { font-size: 10px; }
    #upload-bar .ub-link { font-size: 12px; min-height: 44px; display: inline-flex; align-items: center; }

    /* Year dropdown: above hamburger button on mobile */
    #year-dropdown { right: 12px; bottom: 80px; }

    /* Hamburger menu visible */
    #mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
    #mobile-menu { display: block; }

    /* Touch targets */
    #ctrl-panel .chip, #mobile-menu .chip { min-height: 36px; min-width: 36px; padding: 8px 12px; font-size: 9px; }
    #filter-panel .fp-chip { min-height: 36px; padding: 8px 14px; font-size: 10px; }

    /* Font size minimums */
    #info { font-size: 10px; }
    #filter-status { font-size: 10px; }
    #ctrl-panel label, #filter-panel label { font-size: 9px; }
  }
</style>
</head>
<body>

<div id="hud">
  <h1>Galaxy Artifact</h1>
  <div class="sub" id="hud-sub"></div>
</div>
<div id="bottom-left">
  <div id="artifact-bag">
    <button class="ab-toggle" id="ab-toggle">
      <span class="ab-icon">♡</span>
      <span class="ab-count" id="ab-count">0</span>
      <span class="ab-label">Artifact Archive</span>
      <span class="ab-chevron">▼</span>
    </button>
    <div class="ab-body">
      <div class="ab-body-inner">
        <div class="ab-list" id="ab-list"></div>
        <div class="ab-empty" id="ab-empty">Heart artifacts to build your archive</div>
      </div>
      <div class="ab-footer">
        <button class="ab-export" id="ab-export" title="Export collection" aria-label="Export artifact archive">Export</button>
      </div>
    </div>
  </div>
  <div id="info"></div>
  <div id="upload-bar">
    <button class="ub-link" id="upload-btn" aria-label="Upload your own CSV or XML file">Upload your own CSV or XML</button>
    <input type="file" id="file-input" accept=".csv,.tsv,.txt,.xml,text/*,application/xml">
    <div class="ub-status" id="upload-status"></div>
    <div class="ub-progress" id="upload-progress"><div class="ub-progress-fill" id="upload-progress-fill"></div></div>
  </div>
</div>

<div id="search-bar" style="position:relative;">
  <button id="search-toggle" aria-label="Toggle search">&#x2315;</button>
  <input type="text" id="search-input" placeholder="Search..." autocomplete="off" style="padding-right:40px;" role="combobox" aria-expanded="false" aria-controls="search-results" aria-label="Search artifacts">
  <span id="search-count"></span>
</div>
<div id="search-results" role="listbox"></div>

<div id="year-dropdown" aria-label="Year filter">
  <span class="yd-label">Year</span>
  <select id="year-select" aria-label="Filter by year"></select>
</div>

<button id="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">&#9776;</button>
<div id="mobile-menu-backdrop"></div>
<div id="mobile-menu" role="dialog" aria-label="Settings menu">
  <div class="mm-handle"><div class="mm-handle-bar"></div></div>
  <div class="mm-header">
    <div class="mm-tabs" role="tablist">
      <button class="mm-tab active" data-panel="mm-customize" role="tab" aria-selected="true">Customize</button>
      <button class="mm-tab" data-panel="mm-filter" role="tab" aria-selected="false">Filter</button>
    </div>
    <button class="mm-close" aria-label="Close menu">&times;</button>
  </div>
  <div class="mm-panel active" id="mm-customize" role="tabpanel"></div>
  <div class="mm-panel" id="mm-filter" role="tabpanel"></div>
</div>

<button id="ctrl-toggle" aria-label="Toggle customize panel" aria-expanded="false">Customize</button>
<div id="ctrl-panel">
  <label>Layout</label>
  <div class="row" id="layout-row"></div>
  <hr>
  <label>Palette</label>
  <div class="row" id="pal-row"></div>
  <label>Background</label>
  <div class="row" id="bg-row"></div>
  <hr>
  <label>Bloom</label>
  <input type="range" id="r-bloom" min="0" max="2" step="0.05" value="0">
  <label>Object Scale</label>
  <input type="range" id="r-scale" min="0.2" max="3" step="0.1" value="1">
  <label>Fly Speed</label>
  <input type="range" id="r-speed" min="-2" max="2" step="0.01" value="0.15">
  <label>Fog</label>
  <input type="range" id="r-fog" min="0" max="0.008" step="0.0002" value="0.0004">
  <label>Label Size</label>
  <input type="range" id="r-label-size" min="0.3" max="3" step="0.1" value="1">
  <hr>
  <label>Toggles</label>
  <div class="row">
    <button class="chip on" id="t-labels">Labels</button>
    <button class="chip" id="t-orbit">Orbit</button>
    <button class="chip on" id="t-autofly">Auto-Fly</button>
    <button class="chip" id="t-figure8">Figure-8</button>
    <button class="chip" id="t-wave">Wave</button>
  </div>
</div>

<button id="filter-toggle" aria-label="Toggle filter and sort panel" aria-expanded="false">Filter / Sort</button>
<div id="filter-panel">
  <div class="fp-section-title">Sort</div>
  <div class="fp-sort-row">
    <select id="sort-col"></select>
    <button class="fp-sort-dir on" id="sort-dir">ASC</button>
  </div>
  <hr class="fp-divider">
  <div id="filter-list"></div>
  <div class="fp-footer">
    <span class="fp-status" id="filter-status"></span>
    <button class="fp-clear" id="filter-clear">Clear</button>
  </div>
</div>

<div id="album-card" role="dialog" aria-label="Album details">
  <div class="ac-handle"><div class="ac-handle-bar"></div></div>
  <button class="ac-heart" title="Add to Artifact Archive" aria-label="Add to Artifact Archive">
    <svg class="heart-svg" viewBox="0 0 24 24" width="20" height="20">
      <path class="heart-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </button>
  <button class="ac-close" aria-label="Close album card">&times;</button>
  <div class="ac-name"></div>
  <div class="ac-sub"></div>
  <div class="ac-genre"></div>
  <br>
  <div class="ac-links">
    <a class="ac-link ac-yt" href="#" target="_blank" rel="noopener noreferrer">YouTube</a>
    <a class="ac-link ac-spotify" href="#" target="_blank" rel="noopener noreferrer">Spotify</a>
    <a class="ac-link ac-apple" href="#" target="_blank" rel="noopener noreferrer">Apple Music</a>
    <a class="ac-link ac-discogs" href="#" target="_blank" rel="noopener noreferrer">Discogs</a>
  </div>
</div>

<div id="sr-announcer" role="status" aria-live="polite"></div>
<div id="loading" role="status" aria-live="polite">/// Loading library... ///</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/"
} }
</script>

<script type="module" src="./src/app.js"></script>
</body>
</html>
